    <title>Resep Chicken Arroz Caldo</title>

  <body>
    <h1>Resep Chicken Arroz Caldo(Bubur Nasi Ayam)</h1>
    <figure>
      <img
        src="https://www.allrecipes.com/thmb/pd3VLRiLJcnUyR0LdUIUmUH5h5k=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc():format(webp)/212940-Chicken-Arroz-Caldo-Chicken-Rice-Porridge-ddmfs-4x3-694b22859e6848458d30e4276a027ecb.jpg"
        width="400"
        height="350"
        alt="Semangkuk bubur nasi ayam (arroz caldo) yang diberi irisan daun bawang dan irisan lemon"
      />
      <figcaption>Chicken Arroz Caldo</figcaption>
      <h3>Deskripsi</h3>
      <p>
        Arroz caldo adalah sup nasi dan ayam Filipina yang lezat dan
        menenangkan, disajikan terutama sebagai camilan tetapi dapat dinikmati
        kapan saja sepanjang hari.
      </p>
      <h4>Bahan-bahan:</h4>
      <ul>
        <li>2 sendok makan minyak zaitun</li>
        <li>1 bawang bombay, potong dadu</li>
        <li>2 siung bawang putih, hancurkan</li>
        <li>1 potong jahe segar (2 inci), kupas dan iris tipis</li>
        <li>2 ¼ pon sayap ayam, belah dan buang ujungnya</li>
        <li>1 sendok makan kecap ikan (Opsional)</li>
        <li>5 ¼ cangkir kaldu ayam</li>
        <li>1 cangkir beras ketan manis</li>
        <li>garam dan merica sesuai selera</li>
        <li>1 daun bawang, cincang</li>
        <li>1 lemon, iris (Opsional)</li>
        <li>
          1 sendok teh kecap ikan untuk ditaburkan, jika diinginkan (Opsional)
        </li>
      </ul>
      <h4>Langkah Pembuatan:</h4>
      <ol>
        <li>Kumpulkan semua bahan.</li>
        <li>Panaskan minyak dalam panci besar dengan api sedang.</li>
        <li>
          Tumis bawang bombay, bawang putih, dan jahe dalam minyak panas hingga
          harum, sekitar 5 menit.
        </li>
        <li>
          Masukkan sayap ayam; masak dan aduk selama 1 menit. Masukkan saus
          ikan, tutup panci, dan masak lagi selama 2 menit.
        </li>
        <li>
          Tuangkan kaldu ayam ke dalam panci. Masukkan nasi manis dan didihkan.
          Tutup panci dan masak selama 10 menit, aduk sesekali agar nasi tidak
          lengket di dasar panci.
        </li>
        <li>
          Bumbui dengan garam dan merica. Tuang sup ke dalam mangkuk dan hiasi
          dengan daun bawang.
        </li>
        <li>
          Sajikan dengan irisan lemon dan saus ikan tambahan, jika diinginkan.
        </li>
      </ol>
    </figure>
