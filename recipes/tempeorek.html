<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resep Tempe Orek Sehat</title>
  </head>
  <body>
    <h1>Resep Tempe Orek Kecap Sehat Tinggi Protein</h1>
    <figure>
      <img
        src="https://img-global.cpcdn.com/recipes/b0618c15f6348f10/680x964cq70/tempe-orek-simple-foto-resep-utama.webp"
        width="400"
        height="500"
        alt="tempe orek"
      />
      <figcaption>Tempe Orek Simple</figcaption>
      <h3>Deskripsi</h3>
      <p>
        Tempe Orek gampang dibuat dan tinggi protein, cocok untuk membangun otot
      </p>
      <h4>Bahan-bahan:</h4>
      <ul>
        <li>600gram Tempe</li>
        <li>1-2 Sendok Makan Minyak</li>
        <li>150Ml Air</li>
        <li>3 Sendok Makan Kecap Manis(Less Sugar)</li>
        <li>2 Sendok Makan Saus Tiram</li>
        <li>1 Sendok Makan Kecap Asin</li>
        <li>Lada Putih</li>
        <li>8 Siung Bawang Merah</li>
        <li>5 Siung Bawang Putih</li>
        <li>3 Cabai Merah Besar / Cabai keriting merah</li>
        <li>Daun Bawang</li>
      </ul>
      <h4>Langkah Pembuatan:</h4>
      <ol>
        <li>Potong tempe kecil-kecil seperti di video.</li>
        <li>Tumis tempe (jangan digoreng) dengan minyak secukupnya.</li>
        <li>
          Masak tempe hingga matang merata dan warnanya berubah menjadi kuning
          kecoklatan, lalu angkat.
        </li>
        <li>
          Campurkan air, kecap manis (usahakan yang less sugar), saus tiram,
          kecap asin, dan lada putih untuk membuat bumbu.
        </li>
        <li>Potong bawang merah, bawang putih, dan cabai.</li>
        <li>Tumis bawang dan cabai hingga harum.</li>
        <li>Masukkan tempe ke dalam tumisan bumbu.</li>
        <li>
          Tambahkan campuran bumbu cair, lalu masak hingga air menyusut/habis.
        </li>
        <li>Terakhir, tambahkan daun bawang sebelum disajikan.</li>
      </ol>
    </figure>

  </body>
</html>
